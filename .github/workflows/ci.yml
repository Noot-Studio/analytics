name: CI

# Code-quality gate. Runs on every branch push and every pull request.
on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Canonical CI env (shared with claude.yml). See .github/ci.env.
      # $GITHUB_ENV rejects comments/blank lines — keep only KEY=value lines.
      - name: Load CI env
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .github/ci.env >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # Cache Turbo's local task outputs across runs.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun test

  # Fails when the Prisma schema changed without a matching migration —
  # production applies prisma/migrations via `prisma migrate deploy`, so any
  # drift between the migration history and the schema would never reach
  # existing databases.
  prisma-migration-drift:
    name: Prisma migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Load CI env
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .github/ci.env >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prisma 7 reads the shadow database from prisma.config.ts
      # (SHADOW_DATABASE_URL) — the --shadow-database-url flag was removed.
      - name: Check migrations match schema
        working-directory: packages/db
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
        run: >-
          bunx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema
          --exit-code

  # Fails when clickhouse/init.sql (fresh installs) and clickhouse/migrations/
  # (existing installs) diverge — see scripts/check-clickhouse-migrations.sh.
  clickhouse-migration-drift:
    name: ClickHouse migration drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check init.sql matches migrations
        run: >-
          scripts/check-clickhouse-migrations.sh
          "${{ github.event.pull_request.base.sha || 'origin/dev' }}"
