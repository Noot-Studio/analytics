name: CI

# Code-quality gate. Runs on every branch push and every pull request.
on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Canonical CI env (shared with claude.yml). See .github/ci.env.
      - name: Load CI env
        run: cat .github/ci.env >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # Cache Turbo's local task outputs across runs.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun test
