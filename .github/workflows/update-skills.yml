name: Update Skills

# Keeps the skills vendored under .agents/skills, .claude/skills and
# .kiro/skills in sync with their upstream sources (skill.sh / vercel-labs
# `skills` CLI). `skills update` recomputes each skill's folder hash against
# upstream and rewrites any that drifted, along with skills-lock.json. When
# that produces a diff, a skill is outdated and we open a PR into `dev`.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Don't stack runs; a newer check supersedes an in-flight one.
concurrency:
  group: update-skills
  cancel-in-progress: true

jobs:
  update-skills:
    name: Update outdated skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # Read-only report of which skills have updates available. Logged for
      # the run summary; the actual gate is the git diff from `update` below.
      - name: Report outdated skills
        run: bunx skills@latest check || true

      # Rewrites drifted skills + skills-lock.json. `-y` skips the scope
      # prompt; auto-detects project scope from the repo's skills-lock.json.
      - name: Update skills
        run: bunx skills@latest update -y

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: chore/update-skills
          delete-branch: true
          commit-message: "chore: update outdated skills"
          title: "chore: update outdated skills"
          labels: ready-for-human
          body: |
            Automated by the **Update Skills** workflow.

            One or more vendored skills drifted from their upstream source
            (tracked in `skills-lock.json`). `skills update` pulled the latest
            versions; the diff in this PR is the result.

            Review the changes and merge into `dev`.
