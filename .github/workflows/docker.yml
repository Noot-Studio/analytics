name: Docker

# Build all app images on every push and PR (validation); publish to GHCR only
# on pushes to dev/master and version tags.
on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Pull with: IMAGE_PREFIX=ghcr.io/noot-studio/sbox-analytics docker compose up -d
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/noot-studio/sbox-analytics

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
          - app: ingest
            dockerfile: apps/ingest/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
            build-args: |
              VITE_SERVER_URL=http://localhost:3000
              VITE_DOCS_URL=http://localhost:3002
          # fumadocs prerender boots a server and crawls it during build; the
          # crawler needs host networking to reach it (see apps/fumadocs/Dockerfile).
          - app: docs
            dockerfile: apps/fumadocs/Dockerfile
            network: host
            allow: network.host
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # Permit the docs build to use --network=host.
          buildkitd-flags: --allow-insecure-entitlement network.host

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          network: ${{ matrix.network }}
          allow: ${{ matrix.allow }}
          # Publish on branch/tag pushes; build-only for PRs.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
