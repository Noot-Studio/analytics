name: Docker

# Build all app images on every push and PR (validation); publish to GHCR only
# on pushes to dev/main and version tags. Version tags come from release.yml
# (release-please), which produces the semver-tagged production images.
on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Pull with: IMAGE_PREFIX=ghcr.io/noot-studio/sbox-analytics docker compose up -d
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/noot-studio/sbox-analytics

jobs:
  # Bun/Hono + Vite/nginx apps. Built with the docker-container driver for
  # layer caching across runs.
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: server
            dockerfile: apps/server/Dockerfile
          # One-shot migration runner referenced by docker-compose.yaml
          # (prisma migrate deploy + ClickHouse migrations).
          - app: migrate
            dockerfile: apps/server/Dockerfile
            target: build
          - app: ingest
            dockerfile: apps/ingest/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
            build-args: |
              VITE_SERVER_URL=http://localhost:3000
              VITE_DOCS_URL=http://localhost:3002
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Docs (fumadocs) is built separately with the classic `docker` driver.
  # Its TanStack Start prerender boots a loopback server and crawls it during
  # the build; the buildx docker-container driver's network sandbox can't reach
  # that server even with host networking, while the docker driver can. The
  # docker driver doesn't support GHA layer cache, but the docs build is fast.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/docs
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/fumadocs/Dockerfile
          # Prerender boots a server and crawls it; the docker driver gives the
          # build a working loopback over host networking.
          network: host
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # docker driver supports neither GHA cache export nor provenance attestations.
          provenance: false
