name: sbox-analytics

services:
  postgres:
    image: postgres
    container_name: sbox-analytics-postgres
    environment:
      POSTGRES_DB: sbox-analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - sbox-analytics_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sbox-analytics_postgres_data:
